<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 72 72" width="72" height="72">
  <defs>
    <linearGradient id="coxBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f5d49a"/>
      <stop offset="0.5" stop-color="#e8b568"/>
      <stop offset="1" stop-color="#c08742"/>
    </linearGradient>
    <linearGradient id="coxTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fae3b6"/>
      <stop offset="1" stop-color="#e8b568"/>
    </linearGradient>
  </defs>
  <!-- plate shadow -->
  <ellipse cx="36" cy="64" rx="20" ry="3" fill="#5a3550" opacity=".18"/>
  <!-- teardrop body: rounded bottom, narrowing upward -->
  <path d="M36 8
           C 24 8, 18 22, 18 38
           C 18 52, 26 60, 36 60
           C 46 60, 54 52, 54 38
           C 54 22, 48 8, 36 8 Z"
        fill="url(#coxBody)" stroke="#7a4a2a" stroke-width="2" stroke-linejoin="round"/>
  <!-- the classic crimped "knotch" at the top of a coxinha -->
  <path d="M30 8 Q33 14 36 8 Q39 14 42 8"
        fill="none" stroke="#7a4a2a" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- golden-baked highlight on the upper-left belly -->
  <path d="M22 30 Q21 42 26 52" stroke="#fff3d0" stroke-width="2.4" fill="none" stroke-linecap="round" opacity=".6"/>
  <!-- subtle breadcrumb texture: a few warm speckles -->
  <g fill="#a87238" opacity=".55">
    <circle cx="28" cy="26" r="0.9"/>
    <circle cx="34" cy="32" r="0.7"/>
    <circle cx="42" cy="28" r="0.8"/>
    <circle cx="40" cy="42" r="0.7"/>
    <circle cx="30" cy="44" r="0.8"/>
    <circle cx="46" cy="38" r="0.6"/>
    <circle cx="26" cy="38" r="0.6"/>
  </g>
  <!-- kawaii face on the lower belly -->
  <ellipse cx="30" cy="44" rx="1.8" ry="2.4" fill="#3a2618"/>
  <ellipse cx="42" cy="44" rx="1.8" ry="2.4" fill="#3a2618"/>
  <circle cx="30.4" cy="43.4" r="0.5" fill="#fff"/>
  <circle cx="42.4" cy="43.4" r="0.5" fill="#fff"/>
  <path d="M33 49 Q36 52 39 49" stroke="#3a2618" stroke-width="1.4" fill="none" stroke-linecap="round"/>
  <!-- cheek blush -->
  <ellipse cx="26" cy="48" rx="2" ry="1.3" fill="#ff9ec6" opacity=".55"/>
  <ellipse cx="46" cy="48" rx="2" ry="1.3" fill="#ff9ec6" opacity=".55"/>
</svg>