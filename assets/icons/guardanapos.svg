<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 72 72" width="72" height="72">
  <g id="color">
    <!-- guardanapo: folded paper napkin, scalloped fan shape on a plate -->
    <!-- plate -->
    <ellipse cx="36" cy="56" rx="28" ry="6" fill="#dff1ff" stroke="#9ed6ff" stroke-width="1.6"/>
    <!-- folded napkin: triangle fan rising from plate -->
    <path d="M36 56 L18 22 L54 22 Z" fill="#ff9ec6" stroke="#c94e8a" stroke-width="1.6" stroke-linejoin="round"/>
    <!-- fold lines (creases) -->
    <line x1="22" y1="32" x2="50" y2="32" stroke="#c94e8a" stroke-width="1.2" opacity=".7"/>
    <line x1="20" y1="40" x2="52" y2="40" stroke="#c94e8a" stroke-width="1.2" opacity=".7"/>
    <line x1="18" y1="48" x2="54" y2="48" stroke="#c94e8a" stroke-width="1.2" opacity=".7"/>
    <!-- center accent (small flower / monogram) -->
    <circle cx="36" cy="36" r="4" fill="#fff" stroke="#c94e8a" stroke-width="1.4"/>
    <circle cx="36" cy="36" r="1.6" fill="#ff6fa8"/>
  </g>
</svg>