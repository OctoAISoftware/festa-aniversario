<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 72 72" width="72" height="72">
  <g id="color">
    <!-- boca do palhaço: giant red smiling clown mouth on a white round face -->
    <!-- white round face background -->
    <circle cx="36" cy="36" r="28" fill="#fff7d6" stroke="#e6a85a" stroke-width="2"/>
    <!-- white face paint spots -->
    <circle cx="14" cy="20" r="2" fill="#fff" stroke="#e6a85a" stroke-width="0.8"/>
    <circle cx="58" cy="22" r="2" fill="#fff" stroke="#e6a85a" stroke-width="0.8"/>
    <!-- big red lips/mouth: exaggerated smiling shape -->
    <path d="M10 32 Q22 22 36 32 Q50 42 62 32 Q50 60 36 56 Q22 60 10 32 Z" fill="#ff4d5e" stroke="#c92a3a" stroke-width="1.8" stroke-linejoin="round"/>
    <!-- upper teeth row -->
    <path d="M18 34 L24 38 L30 34 L36 38 L42 34 L48 38 L54 34" fill="none" stroke="#fff" stroke-width="3.6" stroke-linecap="round"/>
    <!-- lower lip highlight -->
    <ellipse cx="36" cy="50" rx="8" ry="2.6" fill="#fff" opacity=".7"/>
    <!-- tiny eyes (closed/squinting) -->
    <path d="M22 22 Q24 26 26 22" fill="none" stroke="#3a2a36" stroke-width="1.6" stroke-linecap="round"/>
    <path d="M46 22 Q48 26 50 22" fill="none" stroke="#3a2a36" stroke-width="1.6" stroke-linecap="round"/>
    <!-- red nose dot -->
    <circle cx="36" cy="28" r="3" fill="#ff4d5e"/>
  </g>
</svg>