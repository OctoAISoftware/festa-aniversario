<!-- Original hopscotch grid (amarelinha) — flat kawaii pastel art matching OpenMoji style. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 72 72" width="72" height="72">
  <g id="color">
    <!-- ground tone background -->
    <rect x="6" y="10" width="60" height="52" rx="6" fill="#cbe8c2"/>
    <!-- chalk-filled numbered squares (numbered 1..8 — three rows, classic layout) -->
    <!-- row 1 -->
    <rect x="16" y="16" width="14" height="14" rx="2" fill="#fff" opacity=".95"/>
    <!-- row 2 -->
    <rect x="10" y="34" width="14" height="14" rx="2" fill="#fff" opacity=".95"/>
    <rect x="28" y="34" width="14" height="14" rx="2" fill="#fff" opacity=".95"/>
    <!-- row 3 -->
    <rect x="16" y="52" width="14" height="14" rx="2" fill="#fff" opacity=".95"/>
    <rect x="34" y="52" width="14" height="14" rx="2" fill="#fff" opacity=".95"/>
    <!-- side circles (chalk dots) -->
    <circle cx="50" cy="22" r="3" fill="#fff" opacity=".9"/>
    <circle cx="50" cy="40" r="3" fill="#fff" opacity=".9"/>
    <circle cx="52" cy="58" r="3" fill="#fff" opacity=".9"/>
    <!-- chalk numbers (1..8 in soft pastel pink/purple) -->
    <text x="23" y="27" font-size="9" font-weight="900" text-anchor="middle" fill="#ff6fa8" font-family="-apple-system, sans-serif">1</text>
    <text x="17" y="45" font-size="9" font-weight="900" text-anchor="middle" fill="#ff6fa8" font-family="-apple-system, sans-serif">2</text>
    <text x="35" y="45" font-size="9" font-weight="900" text-anchor="middle" fill="#ff6fa8" font-family="-apple-system, sans-serif">3</text>
    <text x="23" y="63" font-size="9" font-weight="900" text-anchor="middle" fill="#ff6fa8" font-family="-apple-system, sans-serif">4</text>
    <text x="41" y="63" font-size="9" font-weight="900" text-anchor="middle" fill="#ff6fa8" font-family="-apple-system, sans-serif">5</text>
  </g>
  <g id="line">
    <rect x="16" y="16" width="14" height="14" rx="2" fill="none" stroke="#000000" stroke-linecap="round" stroke-linejoin="round" stroke-miterlimit="10" stroke-width="2"/>
    <rect x="10" y="34" width="14" height="14" rx="2" fill="none" stroke="#000000" stroke-linecap="round" stroke-linejoin="round" stroke-miterlimit="10" stroke-width="2"/>
    <rect x="28" y="34" width="14" height="14" rx="2" fill="none" stroke="#000000" stroke-linecap="round" stroke-linejoin="round" stroke-miterlimit="10" stroke-width="2"/>
    <rect x="16" y="52" width="14" height="14" rx="2" fill="none" stroke="#000000" stroke-linecap="round" stroke-linejoin="round" stroke-miterlimit="10" stroke-width="2"/>
    <rect x="34" y="52" width="14" height="14" rx="2" fill="none" stroke="#000000" stroke-linecap="round" stroke-linejoin="round" stroke-miterlimit="10" stroke-width="2"/>
  </g>
</svg>