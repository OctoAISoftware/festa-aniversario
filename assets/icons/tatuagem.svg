<!-- Original face-paint heart tattoo (tatuagem de festa) — flat kawaii pastel art matching OpenMoji style. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 72 72" width="72" height="72">
  <g id="color">
    <!-- face background (round, soft skin tone) -->
    <circle cx="36" cy="36" r="26" fill="#ffe1c8"/>
    <!-- face-paint heart on cheek -->
    <path fill="#ff4d8d" stroke="none" d="M36 40 C 31 34, 22 36, 22 42 C 22 48, 30 53, 36 58 C 42 53, 50 48, 50 42 C 50 36, 41 34, 36 40 Z"/>
    <!-- inner sparkle on heart -->
    <circle cx="29" cy="42" r="2" fill="#fff"/>
    <!-- decorative sparkles around face -->
    <path fill="#9ed6ff" d="M14 22 L 16 26 L 20 28 L 16 30 L 14 34 L 12 30 L 8 28 L 12 26 Z"/>
    <path fill="#7ddcb1" d="M58 22 L 60 26 L 64 28 L 60 30 L 58 34 L 56 30 L 52 28 L 56 26 Z"/>
    <!-- eyes -->
    <ellipse cx="28" cy="28" rx="2.2" ry="2.8" fill="#3a2a36"/>
    <ellipse cx="44" cy="28" rx="2.2" ry="2.8" fill="#3a2a36"/>
    <circle cx="28.6" cy="27" r=".8" fill="#fff"/>
    <circle cx="44.6" cy="27" r=".8" fill="#fff"/>
    <!-- smile -->
    <path d="M30 34 Q 36 38 42 34" stroke="#3a2a36" stroke-width="1.6" fill="none" stroke-linecap="round"/>
  </g>
  <g id="line">
    <circle cx="36" cy="36" r="26" fill="none" stroke="#000000" stroke-miterlimit="10" stroke-width="2"/>
    <path fill="none" stroke="#000000" stroke-linecap="round" stroke-linejoin="round" stroke-miterlimit="10" stroke-width="2" d="M36 40 C 31 34, 22 36, 22 42 C 22 48, 30 53, 36 58 C 42 53, 50 48, 50 42 C 50 36, 41 34, 36 40 Z"/>
  </g>
</svg>