<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 72 72" width="72" height="72">
  <g id="color">
    <!-- tatuagem de festa: face-paint star sticker on a cheek -->
    <!-- cheek/skin tone circle -->
    <circle cx="36" cy="36" r="26" fill="#ffe1c8" stroke="#e8b794" stroke-width="1.4"/>
    <!-- a 5-point star tattoo on cheek (kawaii) -->
    <polygon points="36,14 40,28 54,28 43,36 47,50 36,42 25,50 29,36 18,28 32,28" fill="#ff4d8d" stroke="#c92a6e" stroke-width="1.6" stroke-linejoin="round"/>
    <!-- inner star highlight -->
    <polygon points="36,22 38,30 46,30 40,35 42,42 36,38 30,42 32,35 26,30 34,30" fill="#ff9ec6"/>
    <!-- decorative sparkles around -->
    <circle cx="14" cy="14" r="2" fill="#9ed6ff"/>
    <circle cx="58" cy="56" r="2" fill="#ffe28a"/>
    <circle cx="58" cy="14" r="1.6" fill="#7ddcb1"/>
    <circle cx="14" cy="58" r="1.6" fill="#e9d8ff"/>
  </g>
</svg>