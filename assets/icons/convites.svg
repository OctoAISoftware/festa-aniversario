<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 72 72" width="72" height="72">
  <g id="color">
    <!-- convite de festa: envelope with invitation card peeking out -->
    <!-- back envelope body -->
    <rect x="10" y="22" width="52" height="40" rx="4" fill="#9ed6ff" stroke="#5aa5d8" stroke-width="1.6"/>
    <!-- envelope flap (closed top) -->
    <path d="M10 22 L36 44 L62 22 Z" fill="#7ec5ee" stroke="#5aa5d8" stroke-width="1.6" stroke-linejoin="round"/>
    <!-- invitation card peeking out top -->
    <rect x="20" y="10" width="32" height="22" rx="2" fill="#fff" stroke="#c94e8a" stroke-width="1.6"/>
    <!-- card content: a heart + sparkles -->
    <path d="M36 24 Q30 18 28 22 Q26 26 36 30 Q46 26 44 22 Q42 18 36 24 Z" fill="#ff6fa8" stroke="#c94e8a" stroke-width="1.2" stroke-linejoin="round"/>
    <circle cx="20" cy="14" r="1.2" fill="#ffe28a"/>
    <circle cx="52" cy="14" r="1.2" fill="#7ddcb1"/>
    <circle cx="36" cy="14" r="1" fill="#e9d8ff"/>
    <!-- seal on envelope flap -->
    <circle cx="36" cy="34" r="4" fill="#ffe28a" stroke="#d8a93a" stroke-width="1.2"/>
    <polygon points="36,31 37,33.5 39.5,33.5 37.5,35 38.5,37.5 36,35.7 33.5,37.5 34.5,35 32.5,33.5 35,33.5" fill="#d8a93a"/>
    <!-- address lines on envelope -->
    <line x1="16" y1="50" x2="56" y2="50" stroke="#5aa5d8" stroke-width="1" opacity=".7"/>
    <line x1="16" y1="56" x2="48" y2="56" stroke="#5aa5d8" stroke-width="1" opacity=".7"/>
  </g>
</svg>