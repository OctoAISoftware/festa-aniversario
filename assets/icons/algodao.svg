<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 72 72" width="72" height="72">
<!-- Original cotton candy (algodão-doce) — flat kawaii pastel art matching OpenMoji style. -->
<g id="color">
  <!-- stick -->
  <rect x="32" y="55" width="8" height="14" rx="1.2" fill="#f4aa41"/>
  <rect x="32" y="55" width="8" height="3" fill="#d68a2a"/>
  <!-- paper cone wrapper -->
  <path d="M22 56 L50 56 L46 64 L26 64 Z" fill="#9ed6ff" stroke="none"/>
  <path d="M22 56 L50 56 L48 60 L24 60 Z" fill="#cfeaff" stroke="none"/>
  <!-- cotton candy swirl: layered puffs -->
  <path d="M36 16
           C 18 16, 14 32, 22 38
           C 14 44, 22 58, 36 56
           C 50 58, 58 44, 50 38
           C 58 32, 54 16, 36 16 Z"
        fill="#ffb3d6"/>
  <path d="M36 16
           C 24 16, 20 28, 26 34
           C 22 40, 28 48, 36 46
           C 44 48, 50 40, 46 34
           C 52 28, 48 16, 36 16 Z"
        fill="#ffc7e0"/>
  <!-- swirl highlight strokes -->
  <path d="M28 30 Q 36 26 44 30" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" opacity=".85"/>
  <path d="M26 38 Q 36 34 46 38" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" opacity=".75"/>
  <path d="M30 46 Q 36 44 42 46" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round" opacity=".7"/>
  <!-- small sparkle dots -->
  <circle cx="22" cy="22" r="1.4" fill="#fff"/>
  <circle cx="52" cy="24" r="1.2" fill="#fff"/>
  <circle cx="48" cy="48" r="1.4" fill="#fff"/>
</g>
<g id="line">
  <!-- outlines drawn last so they sit on top -->
  <path d="M36 16
           C 18 16, 14 32, 22 38
           C 14 44, 22 58, 36 56
           C 50 58, 58 44, 50 38
           C 58 32, 54 16, 36 16 Z"
        fill="none" stroke="#000" stroke-width="2" stroke-linejoin="round"/>
  <path d="M22 56 L50 56 L46 64 L26 64 Z" fill="none" stroke="#000" stroke-width="2" stroke-linejoin="round"/>
  <rect x="32" y="55" width="8" height="14" rx="1.2" fill="none" stroke="#000" stroke-width="2"/>
  <line x1="32" y1="58" x2="40" y2="58" stroke="#000" stroke-width="1.4" stroke-linecap="round"/>
</g>
</svg>
