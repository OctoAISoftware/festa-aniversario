<!-- Original single balloon with curled ribbon (bexiga) — flat kawaii pastel art matching OpenMoji style. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 72 72" width="72" height="72">
  <g id="color">
    <!-- balloon body (oval / pear shape) -->
    <path fill="#ff4d8d" stroke="none" d="M36 8 C 22 8, 16 20, 16 30 C 16 42, 24 50, 36 50 C 48 50, 56 42, 56 30 C 56 20, 50 8, 36 8 Z"/>
    <!-- highlight (small white glint) -->
    <ellipse cx="27" cy="20" rx="4" ry="6" fill="#fff" opacity=".55"/>
    <!-- balloon knot -->
    <polygon fill="#ff4d8d" points="34,50 38,50 39,54 33,54"/>
    <!-- ribbon (curled) -->
    <path fill="none" stroke="#ff9ec6" stroke-width="2" d="M36 54 Q 32 60, 38 64 Q 42 68, 36 70"/>
    <!-- small ribbon loops -->
    <path fill="#ff9ec6" stroke="none" d="M32 60 Q 30 64, 33 67 Q 30 64, 32 60 Z"/>
    <path fill="#ff9ec6" stroke="none" d="M40 67 Q 43 64, 41 61 Q 43 64, 40 67 Z"/>
  </g>
  <g id="line">
    <path fill="none" stroke="#000000" stroke-linecap="round" stroke-linejoin="round" stroke-miterlimit="10" stroke-width="2" d="M36 8 C 22 8, 16 20, 16 30 C 16 42, 24 50, 36 50 C 48 50, 56 42, 56 30 C 56 20, 50 8, 36 8 Z"/>
    <line x1="34" y1="50" x2="38" y2="50" stroke="#000000" stroke-linecap="round" stroke-miterlimit="10" stroke-width="1.6"/>
    <path fill="none" stroke="#000000" stroke-linecap="round" stroke-linejoin="round" stroke-miterlimit="10" stroke-width="1.6" d="M36 54 Q 32 60, 38 64 Q 42 68, 36 70"/>
  </g>
</svg>