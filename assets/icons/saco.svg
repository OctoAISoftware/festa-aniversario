<!-- Original burlap sack / corrida do saco — flat kawaii pastel art matching OpenMoji style. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 72 72" width="72" height="72">
  <g id="color">
    <!-- sack body (rounded potato sack) -->
    <path fill="#d6a86a" stroke="none" d="M14 24 C 14 19, 22 16, 36 16 C 50 16, 58 19, 58 24 L 60 60 C 60 64, 50 66, 36 66 C 22 66, 12 64, 12 60 Z"/>
    <!-- top folded band -->
    <path fill="#b8864d" stroke="none" d="M14 24 C 14 19, 22 16, 36 16 C 50 16, 58 19, 58 24 L 58 30 C 58 32, 50 33, 36 33 C 22 33, 14 32, 14 30 Z"/>
    <!-- stitch dashes down sides -->
    <path stroke="#fff" stroke-width="1.6" stroke-dasharray="3 3" fill="none" d="M18 32 L 18 60 M 54 32 L 54 60"/>
    <!-- tag/string tie -->
    <line x1="36" y1="14" x2="36" y2="20" stroke="#ff6fa8" stroke-width="2.2"/>
    <circle cx="36" cy="13" r="3.2" fill="#ff6fa8"/>
    <!-- face peeking out the top (happy kid) -->
    <ellipse cx="30" cy="25" rx="2" ry="1.6" fill="#3a2a36"/>
    <ellipse cx="42" cy="25" rx="2" ry="1.6" fill="#3a2a36"/>
    <path d="M32 28 Q 36 31 40 28" stroke="#3a2a36" stroke-width="1.4" fill="none" stroke-linecap="round"/>
  </g>
  <g id="line">
    <path fill="none" stroke="#000000" stroke-linecap="round" stroke-linejoin="round" stroke-miterlimit="10" stroke-width="2" d="M14 24 C 14 19, 22 16, 36 16 C 50 16, 58 19, 58 24 L 60 60 C 60 64, 50 66, 36 66 C 22 66, 12 64, 12 60 Z"/>
    <path fill="none" stroke="#000000" stroke-linecap="round" stroke-linejoin="round" stroke-miterlimit="10" stroke-width="2" d="M14 24 L 58 24"/>
    <path fill="none" stroke="#000000" stroke-linecap="round" stroke-linejoin="round" stroke-miterlimit="10" stroke-width="2" d="M14 30 L 58 30"/>
    <path fill="none" stroke="#000000" stroke-linecap="round" stroke-linejoin="round" stroke-miterlimit="10" stroke-width="2" d="M36 14 L 36 16"/>
  </g>
</svg>