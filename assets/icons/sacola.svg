<!-- Original party-favor paper bag (sacola de lembrancinhas) — flat kawaii pastel art matching OpenMoji style. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 72 72" width="72" height="72">
  <g id="color">
    <!-- bag body -->
    <path fill="#ff9ec6" stroke="none" d="M18 27 L54 27 L57 65 L15 65 Z"/>
    <!-- front fold highlight -->
    <path fill="#ffc7df" stroke="none" d="M18 27 L54 27 L54 32 L18 32 Z"/>
    <!-- side shading -->
    <path fill="#ff6fa8" stroke="none" d="M54 27 L57 65 L51 65 L48 27 Z" opacity=".55"/>
    <!-- handles -->
    <path fill="none" stroke="#5a3550" stroke-width="2.4" stroke-linecap="round" d="M27 27 C 27 16, 33 13, 36 13 C 39 13, 45 16, 45 27"/>
    <!-- decorative polka dots on bag -->
    <circle cx="28" cy="42" r="2.4" fill="#fff"/>
    <circle cx="36" cy="48" r="2.4" fill="#fff"/>
    <circle cx="44" cy="42" r="2.4" fill="#fff"/>
    <circle cx="32" cy="55" r="2.4" fill="#fff"/>
    <circle cx="40" cy="58" r="2.4" fill="#fff"/>
    <!-- top paper edge -->
    <rect x="17" y="25" width="38" height="4" fill="#fff" opacity=".7"/>
  </g>
  <g id="line">
    <polyline fill="none" stroke="#000000" stroke-linecap="round" stroke-linejoin="round" stroke-miterlimit="10" stroke-width="2" points="18,27 15,65 57,65 54,27"/>
    <line x1="18" y1="27" x2="54" y2="27" stroke="#000000" stroke-linecap="round" stroke-miterlimit="10" stroke-width="2"/>
    <path fill="none" stroke="#000000" stroke-linecap="round" stroke-linejoin="round" stroke-miterlimit="10" stroke-width="2" d="M27 27 C 27 16, 33 13, 36 13 C 39 13, 45 16, 45 27"/>
  </g>
</svg>