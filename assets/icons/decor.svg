<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 72 72" width="72" height="72">
  <g id="color">
    <!-- decoração de parede: paper-pom / honeycomb ball hanging -->
    <!-- string from top -->
    <line x1="36" y1="2" x2="36" y2="14" stroke="#5a3550" stroke-width="1.6"/>
    <!-- pom ball body — pink honeycomb -->
    <circle cx="36" cy="38" r="22" fill="#ff9ec6" stroke="#c94e8a" stroke-width="1.6"/>
    <!-- honeycomb facets (curved arcs) -->
    <path d="M16 30 Q36 36 56 30" fill="none" stroke="#c94e8a" stroke-width="1.2" opacity=".7"/>
    <path d="M14 38 Q36 44 58 38" fill="none" stroke="#c94e8a" stroke-width="1.2" opacity=".7"/>
    <path d="M16 46 Q36 52 56 46" fill="none" stroke="#c94e8a" stroke-width="1.2" opacity=".7"/>
    <path d="M22 22 Q36 36 50 22" fill="none" stroke="#c94e8a" stroke-width="1.2" opacity=".7"/>
    <path d="M22 54 Q36 40 50 54" fill="none" stroke="#c94e8a" stroke-width="1.2" opacity=".7"/>
    <!-- center highlight -->
    <ellipse cx="30" cy="32" rx="4" ry="3" fill="#fff" opacity=".5"/>
    <!-- tassel/string hanging from bottom -->
    <line x1="36" y1="60" x2="36" y2="70" stroke="#c94e8a" stroke-width="1.4"/>
    <circle cx="36" cy="68" r="2" fill="#c94e8a"/>
  </g>
</svg>