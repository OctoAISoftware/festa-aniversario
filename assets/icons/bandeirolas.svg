<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 72 72" width="72" height="72">
  <g id="color">
    <!-- bandeirolas: triangular flags bunting on a string -->
    <!-- main rope/string swooping -->
    <path d="M6 18 Q36 32 66 18" fill="none" stroke="#5a3550" stroke-width="1.8" stroke-linecap="round"/>
    <!-- 7 triangular flags -->
    <polygon points="10,20 10,38 22,29" fill="#ff6fa8" stroke="#c94e8a" stroke-width="1.2" stroke-linejoin="round"/>
    <polygon points="20,26 20,44 32,35" fill="#9ed6ff" stroke="#5aa5d8" stroke-width="1.2" stroke-linejoin="round"/>
    <polygon points="30,30 30,48 42,39" fill="#ffe28a" stroke="#d8a93a" stroke-width="1.2" stroke-linejoin="round"/>
    <polygon points="40,30 40,48 52,39" fill="#7ddcb1" stroke="#3f9d77" stroke-width="1.2" stroke-linejoin="round"/>
    <polygon points="50,26 50,44 62,35" fill="#e9d8ff" stroke="#8c6fbf" stroke-width="1.2" stroke-linejoin="round"/>
    <!-- tiny stars on a few flags -->
    <circle cx="16" cy="28" r="1.4" fill="#fff"/>
    <circle cx="36" cy="38" r="1.4" fill="#fff"/>
    <circle cx="56" cy="34" r="1.4" fill="#fff"/>
    <!-- little confetti dots above -->
    <circle cx="14" cy="10" r="1.4" fill="#ff6fa8"/>
    <circle cx="36" cy="6" r="1.4" fill="#9ed6ff"/>
    <circle cx="58" cy="10" r="1.4" fill="#ffe28a"/>
    <rect x="22" y="8" width="3" height="3" fill="#7ddcb1" transform="rotate(20 23.5 9.5)"/>
    <rect x="48" y="6" width="3" height="3" fill="#e9d8ff" transform="rotate(-25 49.5 7.5)"/>
  </g>
</svg>