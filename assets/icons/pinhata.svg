<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 72 72" width="72" height="72">
  <g id="color">
    <!-- piñata: cone body with rainbow paper streamers, hanging string -->
    <!-- string from top -->
    <line x1="36" y1="2" x2="36" y2="14" stroke="#5a3550" stroke-width="1.6"/>
    <!-- top cap (smaller cone) -->
    <path d="M36 14 L26 22 L46 22 Z" fill="#ff6fa8" stroke="#c94e8a" stroke-width="1.6" stroke-linejoin="round"/>
    <!-- main round body -->
    <ellipse cx="36" cy="40" rx="24" ry="22" fill="#ffb3cf" stroke="#c94e8a" stroke-width="1.8"/>
    <!-- vertical stripes (paper layers) -->
    <path d="M22 22 Q18 40 22 60" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round"/>
    <path d="M30 20 Q26 40 30 62" fill="none" stroke="#9ed6ff" stroke-width="5" stroke-linecap="round"/>
    <path d="M42 20 Q46 40 42 62" fill="none" stroke="#ffe28a" stroke-width="5" stroke-linecap="round"/>
    <path d="M50 22 Q54 40 50 60" fill="none" stroke="#7ddcb1" stroke-width="6" stroke-linecap="round"/>
    <!-- horizontal frill at base -->
    <path d="M14 56 Q22 64 30 58 Q36 66 42 58 Q50 64 58 56 L58 62 Q50 70 42 64 Q36 72 30 64 Q22 70 14 62 Z" fill="#ff6fa8" stroke="#c94e8a" stroke-width="1.4" stroke-linejoin="round"/>
    <!-- streamers hanging -->
    <path d="M28 64 Q26 70 22 68" fill="none" stroke="#ffe28a" stroke-width="2.4" stroke-linecap="round"/>
    <path d="M44 64 Q46 70 50 68" fill="none" stroke="#9ed6ff" stroke-width="2.4" stroke-linecap="round"/>
    <!-- cheek blush on body -->
    <circle cx="28" cy="40" r="3" fill="#ff6fa8" opacity=".55"/>
    <circle cx="44" cy="40" r="3" fill="#ff6fa8" opacity=".55"/>
  </g>
</svg>