<!-- Original candy necklace (colar de guloseimas) — flat kawaii pastel art matching OpenMoji style. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 72 72" width="72" height="72">
  <g id="color">
    <!-- necklace string arc -->
    <path fill="none" stroke="#5a3550" stroke-width="2" d="M14 22 Q 36 56 58 22"/>
    <!-- candy beads (sucker / jelly bean / gumball variety, kawaii pastel) -->
    <!-- left jelly bean (pink) -->
    <ellipse cx="18" cy="27" rx="5" ry="4" fill="#ff6fa8" transform="rotate(-30 18 27)"/>
    <!-- candy #2 (yellow round) -->
    <circle cx="24" cy="35" r="4.4" fill="#ffe28a"/>
    <path d="M22 35 L 26 35 M 24 33 L 24 37" stroke="#fff" stroke-width="1"/>
    <!-- candy #3 (mint striped) -->
    <circle cx="30" cy="42" r="4.4" fill="#7ddcb1"/>
    <path d="M27 40 L 33 44 M 27 44 L 33 40" stroke="#fff" stroke-width="1.2"/>
    <!-- candy #4 (blue gumball) -->
    <circle cx="36" cy="46" r="4.4" fill="#9ed6ff"/>
    <circle cx="35" cy="45" r="1.2" fill="#fff" opacity=".8"/>
    <!-- candy #5 (lilac) -->
    <circle cx="42" cy="42" r="4.4" fill="#c8a8e9"/>
    <!-- candy #6 (yellow star) -->
    <circle cx="48" cy="35" r="4.4" fill="#ffe28a"/>
    <path d="M48 33 L 48.8 35 L 50 35 L 49 36 L 49.4 38 L 48 37 L 46.6 38 L 47 36 L 46 35 L 47.2 35 Z" fill="#fff"/>
    <!-- candy #7 (pink) -->
    <ellipse cx="54" cy="27" rx="5" ry="4" fill="#ff9ec6" transform="rotate(30 54 27)"/>
  </g>
  <g id="line">
    <path fill="none" stroke="#000000" stroke-linecap="round" stroke-linejoin="round" stroke-miterlimit="10" stroke-width="2" d="M14 22 Q 36 56 58 22"/>
    <circle cx="36" cy="46" r="4.4" fill="none" stroke="#000000" stroke-miterlimit="10" stroke-width="1.6"/>
  </g>
</svg>