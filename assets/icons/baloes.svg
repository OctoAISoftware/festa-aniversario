<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 72 72" width="72" height="72">
  <g id="color">
    <!-- buquê de 3 balões -->
    <!-- balloon 1 (left, pink) -->
    <ellipse cx="22" cy="26" rx="11" ry="14" fill="#ff9ec6" stroke="#c94e8a" stroke-width="1.4"/>
    <ellipse cx="19" cy="22" rx="2.4" ry="3" fill="#fff" opacity=".7"/>
    <polygon points="22,38 19,42 25,42" fill="#c94e8a"/>
    <!-- balloon 2 (center, yellow) -->
    <ellipse cx="36" cy="20" rx="12" ry="15" fill="#ffe28a" stroke="#d8a93a" stroke-width="1.4"/>
    <ellipse cx="32" cy="16" rx="2.6" ry="3.4" fill="#fff" opacity=".7"/>
    <polygon points="36,33 33,37 39,37" fill="#d8a93a"/>
    <!-- balloon 3 (right, blue) -->
    <ellipse cx="50" cy="26" rx="11" ry="14" fill="#9ed6ff" stroke="#5aa5d8" stroke-width="1.4"/>
    <ellipse cx="47" cy="22" rx="2.4" ry="3" fill="#fff" opacity=".7"/>
    <polygon points="50,38 47,42 53,42" fill="#5aa5d8"/>
    <!-- strings -->
    <path d="M22 42 Q24 56 30 64" fill="none" stroke="#5a3550" stroke-width="1.2" stroke-linecap="round"/>
    <path d="M36 37 Q36 54 32 64" fill="none" stroke="#5a3550" stroke-width="1.2" stroke-linecap="round"/>
    <path d="M50 42 Q48 56 38 64" fill="none" stroke="#5a3550" stroke-width="1.2" stroke-linecap="round"/>
    <!-- ribbon bow where strings meet -->
    <path d="M30 64 Q24 60 22 66 Q24 70 30 64 Z" fill="#ff6fa8" stroke="#c94e8a" stroke-width="1"/>
    <path d="M38 64 Q44 60 46 66 Q44 70 38 64 Z" fill="#ff6fa8" stroke="#c94e8a" stroke-width="1"/>
    <circle cx="34" cy="64" r="2" fill="#c94e8a"/>
  </g>
</svg>