<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 72 72" width="72" height="72">
  <g id="color">
    <!-- toalha de mesa: tablecloth draped over a table edge -->
    <!-- table top edge (brown sliver) -->
    <rect x="4" y="14" width="64" height="6" fill="#c9a78a"/>
    <!-- tablecloth rectangle draped down -->
    <rect x="6" y="20" width="60" height="38" fill="#9ed6ff" stroke="#5aa5d8" stroke-width="1.6"/>
    <!-- polka dot pattern -->
    <circle cx="16" cy="28" r="2" fill="#fff"/>
    <circle cx="28" cy="34" r="2" fill="#fff"/>
    <circle cx="40" cy="28" r="2" fill="#fff"/>
    <circle cx="52" cy="34" r="2" fill="#fff"/>
    <circle cx="22" cy="44" r="2" fill="#fff"/>
    <circle cx="34" cy="50" r="2" fill="#fff"/>
    <circle cx="46" cy="44" r="2" fill="#fff"/>
    <circle cx="58" cy="50" r="2" fill="#fff"/>
    <!-- scalloped/wavy bottom hem -->
    <path d="M6 58 Q12 64 18 58 Q24 64 30 58 Q36 64 42 58 Q48 64 54 58 Q60 64 66 58 L66 58 L6 58 Z" fill="#bfe1f7" stroke="#5aa5d8" stroke-width="1.4" stroke-linejoin="round"/>
    <!-- corner tassel / fringe -->
    <line x1="12" y1="58" x2="11" y2="66" stroke="#5aa5d8" stroke-width="1.2"/>
    <line x1="60" y1="58" x2="61" y2="66" stroke="#5aa5d8" stroke-width="1.2"/>
  </g>
</svg>