<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 72 72" width="72" height="72">
<!-- Original cone party hat (chapéu de festa) — flat kawaii pastel art matching OpenMoji style. -->
<defs>
  <linearGradient id="hatSheen" x1="0" x2="1" y1="0" y2="0">
    <stop offset="0" stop-color="#fff" stop-opacity="0"/>
    <stop offset=".5" stop-color="#fff" stop-opacity=".35"/>
    <stop offset="1" stop-color="#fff" stop-opacity="0"/>
  </linearGradient>
</defs>
<g id="color">
  <!-- pompom -->
  <circle cx="36" cy="11" r="7.5" fill="#ff9ec6"/>
  <circle cx="36" cy="11" r="4.4" fill="#ffc7df"/>
  <!-- cone body (pink stripes) -->
  <path d="M16 60 L56 60 L36 13 Z" fill="#ffc7df"/>
  <!-- diagonal stripes -->
  <path d="M22.5 49 L30 49 L34 60 L26.5 60 Z" fill="#ff6fa8"/>
  <path d="M31.5 37 L39 37 L43 49 L35.5 49 Z" fill="#ff6fa8"/>
  <path d="M40.5 25 L48 25 L52 37 L44.5 37 Z" fill="#ff6fa8"/>
  <!-- elastic strap -->
  <path d="M16 60 Q 12 64, 14 70 Q 22 68, 26 62" fill="none" stroke="#5a3550" stroke-width="2"/>
  <path d="M56 60 Q 60 64, 58 70 Q 50 68, 46 62" fill="none" stroke="#5a3550" stroke-width="2"/>
  <!-- subtle sheen overlay -->
  <path d="M16 60 L56 60 L36 13 Z" fill="url(#hatSheen)"/>
</g>
<g id="line">
  <circle cx="36" cy="11" r="7.5" fill="none" stroke="#000" stroke-width="2"/>
  <path d="M16 60 L56 60 L36 13 Z" fill="none" stroke="#000" stroke-width="2" stroke-linejoin="round"/>
  <path d="M14 70 Q 22 68, 26 62" fill="none" stroke="#000" stroke-width="1.4" stroke-linecap="round"/>
  <path d="M58 70 Q 50 68, 46 62" fill="none" stroke="#000" stroke-width="1.4" stroke-linecap="round"/>
  <!-- stripe edges -->
  <line x1="26.5" y1="60" x2="30" y2="49" stroke="#000" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="35.5" y1="49" x2="39" y2="37" stroke="#000" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="44.5" y1="37" x2="48" y2="25" stroke="#000" stroke-width="1.2" stroke-linecap="round"/>
</g>
</svg>
