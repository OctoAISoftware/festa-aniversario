<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 72 72" width="72" height="72">
  <g id="color">
    <!-- fantasia: witch/princess hat tilted, child-friendly -->
    <!-- brim ellipse -->
    <ellipse cx="36" cy="56" rx="26" ry="6" fill="#9ed6ff" stroke="#5aa5d8" stroke-width="1.6"/>
    <!-- cone hat tilted slightly to right -->
    <path d="M16 50 L40 4 L52 50 Z" fill="#9ed6ff" stroke="#5aa5d8" stroke-width="1.6" stroke-linejoin="round"/>
    <!-- hat band -->
    <path d="M19 46 L49 46 L52 50 L16 50 Z" fill="#5aa5d8"/>
    <!-- star on the band -->
    <polygon points="36,18 38,24 44,24 39,28 41,34 36,30 31,34 33,28 28,24 34,24" fill="#ffe28a" stroke="#d8a93a" stroke-width="1.2" stroke-linejoin="round"/>
    <!-- magic sparkles -->
    <circle cx="58" cy="20" r="1.8" fill="#ffe28a"/>
    <circle cx="14" cy="30" r="1.6" fill="#ff9ec6"/>
    <path d="M62 38 l1.4 1.4 M62 38 l-1.4 1.4 M62 38 l1.4 -1.4 M62 38 l-1.4 -1.4" stroke="#7ddcb1" stroke-width="1.2" stroke-linecap="round"/>
  </g>
</svg>