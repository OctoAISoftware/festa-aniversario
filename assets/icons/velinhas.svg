<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 72 72" width="72" height="72">
  <defs>
    <linearGradient id="candleA" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff5d6"/>
      <stop offset="1" stop-color="#ffe28a"/>
    </linearGradient>
    <linearGradient id="candleB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#dff0fb"/>
      <stop offset="1" stop-color="#9ed6ff"/>
    </linearGradient>
    <linearGradient id="candleC" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe6f1"/>
      <stop offset="1" stop-color="#ff9ec6"/>
    </linearGradient>
  </defs>
  <!-- baseline shadow -->
  <ellipse cx="36" cy="64" rx="22" ry="3" fill="#5a3550" opacity=".18"/>

  <!-- LEFT candle (yellow, shorter) -->
  <g>
    <!-- wick -->
    <line x1="20" y1="32" x2="20" y2="28" stroke="#5a3550" stroke-width="1.2" stroke-linecap="round"/>
    <!-- body -->
    <rect x="16" y="32" width="8" height="26" rx="2" fill="url(#candleA)" stroke="#d8a93a" stroke-width="1.6"/>
    <!-- stripe -->
    <rect x="16" y="42" width="8" height="2.5" fill="#ff9ec6" opacity=".6"/>
    <!-- glow -->
    <ellipse cx="20" cy="24" rx="6" ry="9" fill="#fff3b8" opacity=".55"/>
    <!-- flame -->
    <path d="M20 28 Q15 22 20 14 Q25 22 20 28 Z" fill="#ffd24d" stroke="#ff8a3d" stroke-width="1.4" stroke-linejoin="round"/>
    <path d="M20 24 Q17 21 20 17 Q23 21 20 24 Z" fill="#fff8d6"/>
  </g>

  <!-- CENTER candle (blue, tallest) -->
  <g>
    <line x1="36" y1="26" x2="36" y2="22" stroke="#5a3550" stroke-width="1.2" stroke-linecap="round"/>
    <rect x="32" y="26" width="8" height="32" rx="2" fill="url(#candleB)" stroke="#5fa9d9" stroke-width="1.6"/>
    <rect x="32" y="38" width="8" height="2.5" fill="#ffe28a" opacity=".7"/>
    <ellipse cx="36" cy="18" rx="7" ry="11" fill="#fff3b8" opacity=".55"/>
    <path d="M36 22 Q30 16 36 6 Q42 16 36 22 Z" fill="#ffd24d" stroke="#ff8a3d" stroke-width="1.4" stroke-linejoin="round"/>
    <path d="M36 18 Q33 14 36 10 Q39 14 36 18 Z" fill="#fff8d6"/>
  </g>

  <!-- RIGHT candle (pink, medium) -->
  <g>
    <line x1="52" y1="30" x2="52" y2="26" stroke="#5a3550" stroke-width="1.2" stroke-linecap="round"/>
    <rect x="48" y="30" width="8" height="28" rx="2" fill="url(#candleC)" stroke="#e63578" stroke-width="1.6"/>
    <rect x="48" y="44" width="8" height="2.5" fill="#7ddcb1" opacity=".7"/>
    <ellipse cx="52" cy="22" rx="6" ry="10" fill="#fff3b8" opacity=".55"/>
    <path d="M52 26 Q47 20 52 12 Q57 20 52 26 Z" fill="#ffd24d" stroke="#ff8a3d" stroke-width="1.4" stroke-linejoin="round"/>
    <path d="M52 22 Q49 18 52 14 Q55 18 52 22 Z" fill="#fff8d6"/>
  </g>

  <!-- sparkles around the flames -->
  <g fill="#ffe28a" stroke="#ff9ec6" stroke-width="1">
    <path d="M8 18 l2 2 l-2 2 l-2 -2 z"/>
    <path d="M64 12 l2 2 l-2 2 l-2 -2 z"/>
    <path d="M40 4 l2 2 l-2 2 l-2 -2 z" transform="scale(0.8)"/>
  </g>
</svg>