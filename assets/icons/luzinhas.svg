<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 72 72" width="72" height="72">
  <g id="color">
    <!-- luzinhas: fairy-light string with glowing round bulbs -->
    <!-- main hanging cable -->
    <path d="M4 22 Q36 38 68 22" fill="none" stroke="#5a3550" stroke-width="1.6" stroke-linecap="round"/>
    <!-- hanging strands -->
    <line x1="14" y1="26" x2="14" y2="38" stroke="#5a3550" stroke-width="1"/>
    <line x1="24" y1="30" x2="24" y2="42" stroke="#5a3550" stroke-width="1"/>
    <line x1="34" y1="32" x2="34" y2="44" stroke="#5a3550" stroke-width="1"/>
    <line x1="44" y1="32" x2="44" y2="44" stroke="#5a3550" stroke-width="1"/>
    <line x1="54" y1="30" x2="54" y2="42" stroke="#5a3550" stroke-width="1"/>
    <line x1="64" y1="26" x2="64" y2="38" stroke="#5a3550" stroke-width="1"/>
    <!-- bulb bodies with glow halos -->
    <circle cx="14" cy="42" r="6" fill="#fff3b8"/>
    <circle cx="14" cy="42" r="4" fill="#ffe28a" stroke="#d8a93a" stroke-width="1"/>
    <circle cx="24" cy="46" r="6" fill="#ffd5e6"/>
    <circle cx="24" cy="46" r="4" fill="#ff6fa8" stroke="#c94e8a" stroke-width="1"/>
    <circle cx="34" cy="48" r="6" fill="#dff1ff"/>
    <circle cx="34" cy="48" r="4" fill="#9ed6ff" stroke="#5aa5d8" stroke-width="1"/>
    <circle cx="44" cy="48" r="6" fill="#dfffe6"/>
    <circle cx="44" cy="48" r="4" fill="#7ddcb1" stroke="#3f9d77" stroke-width="1"/>
    <circle cx="54" cy="46" r="6" fill="#f1e8ff"/>
    <circle cx="54" cy="46" r="4" fill="#b89ee0" stroke="#8c6fbf" stroke-width="1"/>
    <circle cx="64" cy="42" r="6" fill="#fff3b8"/>
    <circle cx="64" cy="42" r="4" fill="#ffe28a" stroke="#d8a93a" stroke-width="1"/>
    <!-- tiny shine highlights -->
    <circle cx="12" cy="40" r="0.9" fill="#fff"/>
    <circle cx="22" cy="44" r="0.9" fill="#fff"/>
    <circle cx="32" cy="46" r="0.9" fill="#fff"/>
    <circle cx="42" cy="46" r="0.9" fill="#fff"/>
    <circle cx="52" cy="44" r="0.9" fill="#fff"/>
    <circle cx="62" cy="40" r="0.9" fill="#fff"/>
