<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 72 72" width="72" height="72">
  <g id="color">
    <!-- máscara de festa: masquerade eye mask with feathers -->
    <!-- mask body (curved across eyes) -->
    <path d="M8 36 Q14 22 36 22 Q58 22 64 36 Q58 50 36 50 Q14 50 8 36 Z" fill="#e9d8ff" stroke="#8c6fbf" stroke-width="1.8"/>
    <!-- eye holes -->
    <ellipse cx="22" cy="36" rx="6" ry="7" fill="#5a3550"/>
    <ellipse cx="50" cy="36" rx="6" ry="7" fill="#5a3550"/>
    <!-- eye highlights -->
    <circle cx="24" cy="34" r="1.4" fill="#fff"/>
    <circle cx="52" cy="34" r="1.4" fill="#fff"/>
    <!-- decorative swirls around eyes -->
    <path d="M16 30 Q22 26 28 30" fill="none" stroke="#8c6fbf" stroke-width="1.2"/>
    <path d="M44 30 Q50 26 56 30" fill="none" stroke="#8c6fbf" stroke-width="1.2"/>
    <!-- center jewel -->
    <circle cx="36" cy="36" r="3" fill="#ffe28a" stroke="#d8a93a" stroke-width="1.2"/>
    <!-- side feathers (right) -->
    <path d="M62 36 Q68 22 70 14" fill="none" stroke="#ff6fa8" stroke-width="3" stroke-linecap="round"/>
    <path d="M62 38 Q70 26 72 20" fill="none" stroke="#9ed6ff" stroke-width="3" stroke-linecap="round"/>
    <!-- ribbon ties -->
    <path d="M10 36 Q4 40 2 50" fill="none" stroke="#8c6fbf" stroke-width="1.6"/>
    <circle cx="2" cy="50" r="1.4" fill="#8c6fbf"/>
  </g>
</svg>