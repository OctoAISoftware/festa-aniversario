<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<meta name="theme-color" content="#ffd6e8" />
<title>Festa da Maia — Organizador de Festa</title>
<style>
  :root{
    --pink-50:#fff5fa;
    --pink-100:#ffe3ef;
    --pink-200:#ffc7df;
    --pink-300:#ff9ec6;
    --pink-400:#ff6fa8;
    --pink-500:#ff4d8d;
    --pink-600:#e63578;
    --mint:#bff0d8;
    --mint-2:#7ddcb1;
    --cream:#fff7ec;
    --butter:#ffe28a;
    --sky:#dff1ff;
    --sky-2:#9ed6ff;
    --lilac:#e9d8ff;
    --ink:#5a3550;
    --ink-soft:#8a6a82;
    --shadow:0 10px 24px rgba(255,105,160,.18);
    --shadow-soft:0 6px 14px rgba(255,105,160,.12);
    --r-lg:24px;
    --r-md:16px;
    --r-sm:12px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:linear-gradient(180deg,#fff0f7 0%,#fff7e6 100%);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Comic Sans MS","Comic Sans",cursive,system-ui,sans-serif;color:var(--ink);min-height:100vh;overflow-x:hidden;-webkit-tap-highlight-color:transparent}
  button{font-family:inherit;border:none;background:none;color:inherit;cursor:pointer}
  h1,h2,h3,p{margin:0}
  .no-select{user-select:none;-webkit-user-select:none}

  /* ── HEADER ──────────────────────────────────────────────────────── */
  header.app-bar{
    position:sticky;top:0;z-index:50;
    display:flex;align-items:center;gap:12px;
    padding:14px 18px;
    background:rgba(255,255,255,.85);
    backdrop-filter:blur(14px) saturate(1.4);
    -webkit-backdrop-filter:blur(14px) saturate(1.4);
    border-bottom:2px solid var(--pink-100);
  }
  header.app-bar .logo{
    width:46px;height:46px;border-radius:14px;background:#fff;
    display:grid;place-items:center;box-shadow:var(--shadow-soft);
    border:2px solid var(--pink-100);
  }
  header.app-bar h1{font-size:20px;line-height:1.1;font-weight:800;color:var(--pink-600);letter-spacing:-.01em}
  header.app-bar .sub{font-size:11px;color:var(--ink-soft);font-weight:600}
  header.app-bar .spacer{flex:1}
  header.app-bar .counter{
    display:flex;align-items:center;gap:6px;background:var(--pink-100);
    padding:8px 14px;border-radius:999px;font-weight:800;color:var(--pink-600);
    box-shadow:var(--shadow-soft);
  }
  header.app-bar .counter .dot{width:10px;height:10px;border-radius:50%;background:var(--pink-400);box-shadow:0 0 0 4px #fff inset}
  .screen-title{
    text-align:center;padding:18px 16px 6px;
  }
  .screen-title h2{font-size:26px;color:var(--pink-600);font-weight:900;letter-spacing:-.01em}
  .screen-title p{font-size:14px;color:var(--ink-soft);margin-top:4px}

  /* ── MAIN WRAPPER ────────────────────────────────────────────────── */
  main{padding:0 16px 100px;max-width:980px;margin:0 auto}
  .panel{
    background:#fff;border-radius:var(--r-lg);
    padding:18px;box-shadow:var(--shadow);
    border:2px solid var(--pink-100);
  }

  /* ── SCREEN 1 — item selection grid ──────────────────────────────── */
  #screen-pick{display:block}
  #screen-find,#screen-final{display:none}
  .grid{
    display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));
    gap:14px;margin-top:14px;
  }
  .tile{
    position:relative;background:#fff;border-radius:var(--r-md);
    padding:10px 8px 12px;border:3px solid var(--pink-100);
    box-shadow:var(--shadow-soft);transition:transform .15s ease, border-color .2s ease, background .2s ease;
    cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;
    min-height:120px;
  }
  .tile:hover{transform:translateY(-3px) scale(1.02)}
  .tile:active{transform:translateY(-1px) scale(.98)}
  .tile .icon{width:72px;height:72px;display:grid;place-items:center}
  .tile .name{font-size:12px;font-weight:700;color:var(--ink);text-align:center;line-height:1.15}
  .tile.selected{
    background:linear-gradient(160deg,#fff7fb,#ffeaf3);
    border-color:var(--pink-400);
    box-shadow:0 10px 22px rgba(255,111,168,.28);
    animation:pop .4s ease;
  }
  .tile.selected::after{
    content:"";position:absolute;top:6px;right:6px;width:26px;height:26px;border-radius:50%;
    background:var(--pink-400) url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><path fill='none' stroke='white' stroke-width='3.4' stroke-linecap='round' stroke-linejoin='round' d='M5 12.5 10 17.5 19 7.5'/></svg>") center/18px no-repeat;
    box-shadow:0 4px 10px rgba(255,77,141,.4);
    animation:bounce-in .45s cubic-bezier(.2,1.6,.4,1) both;
  }
  .tile.selected .icon{filter:drop-shadow(0 2px 4px rgba(255,77,141,.25))}
  @keyframes pop{0%{transform:scale(.92)}50%{transform:scale(1.06)}100%{transform:scale(1)}}
  @keyframes bounce-in{0%{transform:scale(0) rotate(-30deg)}70%{transform:scale(1.3) rotate(8deg)}100%{transform:scale(1) rotate(0)}}

  /* CTA */
  .cta-row{margin-top:20px;display:flex;flex-direction:column;align-items:center;gap:10px}
  .cta{
    background:linear-gradient(180deg,var(--pink-400),var(--pink-500));
    color:#fff;font-weight:900;font-size:20px;letter-spacing:.01em;
    padding:18px 30px;border-radius:999px;box-shadow:0 14px 30px rgba(255,77,141,.45);
    transition:transform .15s ease, box-shadow .15s ease, filter .15s ease;
    display:inline-flex;align-items:center;gap:12px;
    border:3px solid #fff;
  }
  .cta:hover{transform:translateY(-2px) scale(1.03)}
  .cta:active{transform:translateY(0) scale(.98)}
  .cta[disabled]{
    background:linear-gradient(180deg,#e6c8d4,#d6b3c2);
    color:#fff8;cursor:not-allowed;box-shadow:none;
  }
  .cta[disabled]:hover{transform:none}
  .cta-hint{font-size:13px;color:var(--ink-soft);font-weight:700;min-height:18px}

  /* ── SCREEN 2 — seek-and-find ────────────────────────────────────── */
  #screen-find .stage{
    position:relative;border-radius:var(--r-lg);overflow:hidden;
    box-shadow:var(--shadow);border:3px solid var(--pink-100);
    background:linear-gradient(180deg,#bfe4ff 0%,#d8ecff 60%,#c8e6c2 100%);
    aspect-ratio: 4/3;
  }
  #scene-svg{position:absolute;inset:0;width:100%;height:100%;display:block}
  .findable{
    cursor:pointer;
    transform-box:fill-box;
    transform-origin:center;
    transition:filter .15s ease;
  }
  .findable:hover{filter:brightness(1.08) drop-shadow(0 0 6px rgba(255,255,255,.7))}
  .findable.found{
    pointer-events:none;
    animation:found-pop .65s ease forwards;
  }
  .findable.hint{
    animation:wiggle 1.2s ease-in-out infinite;
    transform-origin:center;
  }
  @keyframes wiggle{
    0%,100%{transform:rotate(0) scale(1)}
    25%{transform:rotate(-6deg) scale(1.06)}
    75%{transform:rotate(6deg) scale(1.06)}
  }
  @keyframes found-pop{
    0%{transform:scale(1)}
    40%{transform:scale(1.4);filter:drop-shadow(0 0 12px gold)}
    100%{transform:scale(.85);opacity:.55;filter:drop-shadow(0 0 0 transparent)}
  }
  .puff{
    position:absolute;width:18px;height:18px;border-radius:50%;
    background:radial-gradient(circle,#fff 0%,var(--pink-200) 60%,transparent 100%);
    pointer-events:none;animation:puff .55s ease-out forwards;
  }
  @keyframes puff{
    0%{transform:scale(.3);opacity:.9}
    100%{transform:scale(2.4);opacity:0}
  }
  .confetti-burst{
    position:absolute;width:100%;height:100%;top:0;left:0;pointer-events:none;overflow:hidden;
  }
  .confetti-burst span{
    position:absolute;width:10px;height:14px;border-radius:3px;
    top:50%;left:50%;
    animation:confetti 1s cubic-bezier(.2,.7,.3,1) forwards;
  }
  @keyframes confetti{
    0%{transform:translate(-50%,-50%) rotate(0);opacity:1}
    100%{transform:
      translate(calc(-50% + var(--dx,0px)),calc(-50% + var(--dy,0px)))
      rotate(720deg);opacity:0}
  }

  /* sidebar */
  .find-layout{display:grid;grid-template-columns:1fr 200px;gap:14px;margin-top:14px}
  @media (max-width:780px){
    .find-layout{grid-template-columns:1fr}
  }
  .sidebar{
    background:#fff;border-radius:var(--r-lg);
    padding:14px;box-shadow:var(--shadow-soft);border:2px solid var(--pink-100);
  }
  .sidebar h3{font-size:14px;color:var(--pink-600);font-weight:900;margin-bottom:10px}
  .checklist{
    display:grid;grid-template-columns:repeat(5,1fr);gap:8px;
  }
  @media (max-width:780px){.checklist{grid-template-columns:repeat(6,1fr)}}
  .checklist .slot{
    aspect-ratio:1;border-radius:14px;background:var(--pink-50);
    display:grid;place-items:center;border:2px dashed var(--pink-200);
    position:relative;
  }
  .checklist .slot svg{width:80%;height:80%}
  .checklist .slot.found{
    background:linear-gradient(160deg,#ffeaf3,#ffd5e6);
    border:2px solid var(--pink-300);
    animation:slot-pop .5s cubic-bezier(.2,1.6,.4,1);
  }
  .checklist .slot.found::after{
    content:"";position:absolute;top:-6px;right:-6px;width:22px;height:22px;border-radius:50%;
    background:var(--pink-400) url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><path fill='none' stroke='white' stroke-width='3.4' stroke-linecap='round' stroke-linejoin='round' d='M5 12.5 10 17.5 19 7.5'/></svg>") center/16px no-repeat;
    box-shadow:0 4px 10px rgba(255,77,141,.5);
  }
  @keyframes slot-pop{0%{transform:scale(.4)}60%{transform:scale(1.2)}100%{transform:scale(1)}}

  .progress{
    margin-top:12px;background:var(--pink-50);height:14px;border-radius:999px;overflow:hidden;
    border:2px solid var(--pink-100);
  }
  .progress > span{
    display:block;height:100%;width:0%;
    background:linear-gradient(90deg,var(--pink-300),var(--pink-500));
    transition:width .4s cubic-bezier(.2,.8,.2,1);
    border-radius:999px;
  }
  .progress-label{font-size:12px;color:var(--ink-soft);font-weight:700;margin-top:6px;text-align:center}

  /* ── SCREEN 3 — final scene ──────────────────────────────────────── */
  #screen-final .finale{
    position:relative;border-radius:var(--r-lg);overflow:hidden;
    box-shadow:var(--shadow);border:3px solid var(--pink-200);
    background:linear-gradient(180deg,#bfe4ff 0%,#ffe7d6 100%);
    aspect-ratio: 4/3;
  }
  #scene-final-svg{position:absolute;inset:0;width:100%;height:100%}
  .float{animation:float 4s ease-in-out infinite}
  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
  .sparkle{animation:sparkle 1.4s ease-in-out infinite;transform-origin:center}
  @keyframes sparkle{
    0%,100%{transform:scale(1) rotate(0);opacity:.8}
    50%{transform:scale(1.3) rotate(40deg);opacity:1}
  }
  .finale-actions{
    display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin-top:18px;
  }
  .big-btn{
    background:#fff;color:var(--pink-600);
    border:3px solid var(--pink-300);border-radius:22px;
    padding:14px 22px;font-weight:900;font-size:17px;
    box-shadow:var(--shadow-soft);
    display:inline-flex;align-items:center;gap:10px;
    transition:transform .15s ease, box-shadow .15s ease;
  }
  .big-btn:hover{transform:translateY(-2px) scale(1.04)}
  .big-btn.primary{
    background:linear-gradient(180deg,var(--pink-400),var(--pink-500));
    color:#fff;border-color:#fff;
    box-shadow:0 14px 28px rgba(255,77,141,.4);
  }

  /* ── splash ──────────────────────────────────────────────────────── */
  .splash{
    position:fixed;inset:0;z-index:200;background:linear-gradient(160deg,#ffd6e8,#fff5d6);
    display:grid;place-items:center;
    transition:opacity .5s ease;
  }
  .splash .bouncer{
    width:120px;height:120px;border-radius:50%;background:#fff;
    display:grid;place-items:center;box-shadow:var(--shadow);
    animation:bounce-splash 1s ease-in-out infinite;
  }
  @keyframes bounce-splash{0%,100%{transform:translateY(0)}50%{transform:translateY(-18px)}}
  .splash.gone{opacity:0;pointer-events:none}

  /* ── mascot / character SVGs (original, non-Sanrio) ─────────────── */
  .mascot{position:absolute;pointer-events:none}

  /* reduced motion */
  @media (prefers-reduced-motion:reduce){
    *{animation-duration:.01ms !important;animation-iteration-count:1 !important;transition-duration:.01ms !important}
  }
</style>
</head>
<body>
<!-- ── Splash ─────────────────────────────────────────────────────── -->
<div class="splash" id="splash" aria-hidden="true">
  <div class="bouncer">
    <svg viewBox="0 0 80 80" width="80" height="80" aria-hidden="true">
      <!-- original bunny mascot -->
      <defs>
        <radialGradient id="bunnyCheek" cx=".5" cy=".5" r=".5">
          <stop offset="0" stop-color="#ffb3cf"/>
          <stop offset="1" stop-color="#ffb3cf" stop-opacity="0"/>
        </radialGradient>
      </defs>
      <ellipse cx="26" cy="22" rx="6" ry="14" fill="#fff" stroke="#f4c7d9" stroke-width="2"/>
      <ellipse cx="54" cy="22" rx="6" ry="14" fill="#fff" stroke="#f4c7d9" stroke-width="2"/>
      <ellipse cx="26" cy="22" rx="2.6" ry="9" fill="#ffc7df"/>
      <ellipse cx="54" cy="22" rx="2.6" ry="9" fill="#ffc7df"/>
      <circle cx="40" cy="46" r="26" fill="#fff" stroke="#f4c7d9" stroke-width="2.4"/>
      <circle cx="31" cy="44" r="4.5" fill="#ffb3cf" opacity=".6"/>
      <circle cx="49" cy="44" r="4.5" fill="#ffb3cf" opacity=".6"/>
      <circle cx="33" cy="40" r="3" fill="#3a2a36"/>
      <circle cx="47" cy="40" r="3" fill="#3a2a36"/>
      <circle cx="33.6" cy="39.4" r=".9" fill="#fff"/>
      <circle cx="47.6" cy="39.4" r=".9" fill="#fff"/>
      <path d="M37 47 Q40 50 43 47" stroke="#3a2a36" stroke-width="2" fill="none" stroke-linecap="round"/>
      <ellipse cx="40" cy="49" rx="2" ry="1.4" fill="#ff7aa9"/>
    </svg>
  </div>
</div>

<header class="app-bar no-select">
  <div class="logo">
    <svg viewBox="0 0 32 32" width="32" height="32" aria-hidden="true">
      <circle cx="16" cy="16" r="14" fill="#fff" stroke="#ff9ec6" stroke-width="2"/>
      <path d="M16 7 L18.5 12 L24 12.5 L20 16 L21 21.5 L16 18.5 L11 21.5 L12 16 L8 12.5 L13.5 12 Z" fill="#ff6fa8"/>
      <circle cx="16" cy="16" r="3" fill="#fff"/>
    </svg>
  </div>
  <div>
    <h1>Festa da Maia</h1>
    <div class="sub">organize a festa perfeita ✨</div>
  </div>
  <div class="spacer"></div>
  <div class="counter" id="counter" aria-live="polite">
    <span class="dot"></span>
    <span id="counter-num">0</span>
    <span>itens</span>
  </div>
</header>

<!-- ── SCREEN 1: pick items ───────────────────────────────────────── -->
<main id="screen-pick">
  <div class="screen-title">
    <h2>Montar a festa</h2>
    <p>Toque nos itens que você quer na sua festa ✨</p>
  </div>
  <section class="panel">
    <div class="grid" id="grid"></div>
    <div class="cta-row">
      <button class="cta" id="go-find" disabled>
        Vamos procurar!
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
          <path fill="currentColor" d="M5 12h12l-4-4 1.4-1.4L21 12l-6.6 5.4L13 16l4-4H5z"/>
        </svg>
      </button>
      <div class="cta-hint" id="cta-hint">escolha pelo menos 6 itens</div>
    </div>
  </section>
</main>

<!-- ── SCREEN 2: find the items ────────────────────────────────────── -->
<main id="screen-find">
  <div class="screen-title">
    <h2>Achar os itens</h2>
    <p>clique em cada item para marcar ✅</p>
  </div>
  <div class="find-layout">
    <section class="stage" id="stage" aria-label="Cena da festa">
      <svg id="scene-svg" viewBox="0 0 800 600" preserveAspectRatio="xMidYMid slice" aria-hidden="true"></svg>
    </section>
    <aside class="sidebar">
      <h3>Checklist</h3>
      <div class="checklist" id="checklist"></div>
      <div class="progress"><span id="progress-bar"></span></div>
      <div class="progress-label" id="progress-label">0 de 0</div>
    </aside>
  </div>
</main>

<!-- ── SCREEN 3: party time! ──────────────────────────────────────── -->
<main id="screen-final">
  <div class="screen-title">
    <h2>A festa está pronta! 🎉</h2>
    <p>Parabéns pra você! ✨</p>
  </div>
  <section class="panel">
    <div class="finale">
      <svg id="scene-final-svg" viewBox="0 0 800 600" preserveAspectRatio="xMidYMid slice" aria-hidden="true"></svg>
    </div>
    <div class="finale-actions">
      <button class="big-btn primary" id="restart">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
          <path fill="currentColor" d="M12 5V2L7 6l5 4V7a5 5 0 1 1-5 5H5a7 7 0 1 0 7-7z"/>
        </svg>
        Montar outra festa
      </button>
      <button class="big-btn" id="variation">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
          <path fill="currentColor" d="M12 2 14.5 8.5 21 9.3 16 14 17.5 21 12 17.3 6.5 21 8 14 3 9.3 9.5 8.5z"/>
        </svg>
        Outra variação
      </button>
    </div>
  </section>
</main>

<script>
/* ──────────────────────────────────────────────────────────────────
 *  Festa da Maia — single-page game
 *  No external resources. Inline SVG, vanilla JS.
 * ────────────────────────────────────────────────────────────────── */

// ── 40-item catalog (each has id, label pt-BR, icon SVG) ────────────
const ITEMS = [
  // doces / comidas
  {id:"bolo",     label:"bolo",       color:"#ffc7df", icon:iconCake},
  {id:"velinhas", label:"velinhas",   color:"#ffe28a", icon:iconCandles},
  {id:"docinhos", label:"docinhos",   color:"#ffd6e8", icon:iconSweets},
  {id:"brigadeiro",label:"brigadeiro",color:"#5a3550", icon:iconBrigadeiro},
  {id:"sorvete",  label:"sorvete",    color:"#bff0d8", icon:iconIcecream},
  {id:"refrigerante",label:"refrigerante",color:"#9ed6ff", icon:iconSoda},
  {id:"suco",     label:"suco",       color:"#ffe28a", icon:iconJuice},
  {id:"salgadinhos",label:"salgadinhos",color:"#ffd6c0", icon:iconSnack},
  {id:"pizza",    label:"pizza",      color:"#ffe6a3", icon:iconPizza},
  {id:"pipoca",   label:"pipoca",     color:"#fff7ec", icon:iconPopcorn},
  {id:"algodao",  label:"algodão-doce",color:"#ffd6e8", icon:iconCottonCandy},
  {id:"cachorroquente",label:"cachorro-quente",color:"#ffc7a8", icon:iconHotdog},
  // decoração
  {id:"baloes",   label:"balões",     color:"#ffc7df", icon:iconBalloons},
  {id:"chapeu",   label:"chapéu de festa", color:"#9ed6ff", icon:iconPartyHat},
  {id:"serpentina",label:"serpentina",color:"#e9d8ff", icon:iconStreamer},
  {id:"confete",  label:"confete",    color:"#ffe28a", icon:iconConfetti},
  {id:"pratinhos",label:"pratinhos",  color:"#dff1ff", icon:iconPlates},
  {id:"copos",    label:"copos",      color:"#dff1ff", icon:iconCups},
  {id:"guardanapos",label:"guardanapos",color:"#ffc7df", icon:iconNapkins},
  {id:"toalha",   label:"toalha da mesa",color:"#ffd6e8", icon:iconTablecloth},
  {id:"bandeirolas",label:"bandeirolas",color:"#9ed6ff", icon:iconBunting},
  {id:"luzinhas", label:"luzinhas",   color:"#ffe28a", icon:iconLights},

  {id:"mascara",  label:"máscara de festa", color:"#e9d8ff", icon:iconMask},
  {id:"fantasia", label:"fantasia",   color:"#9ed6ff", icon:iconCostume},
  {id:"guardachuva",label:"guarda-chuva de papel",color:"#ffc7df", icon:iconUmbrella},
  {id:"pinhata",  label:"piñata",     color:"#ffe28a", icon:iconPinata},
  // brincadeiras
  {id:"cadeiras", label:"dança das cadeiras",color:"#ffc7df", icon:iconChairs},
  {id:"pescaria", label:"pescaria",   color:"#bff0d8", icon:iconFishing},
  {id:"saco",     label:"corrida do saco",color:"#dff1ff", icon:iconSackRace},
  {id:"boca",     label:"boca do palhaço",color:"#ffe28a", icon:iconClownMouth},
  {id:"amarelinha",label:"amarelinha",color:"#e9d8ff", icon:iconHopscotch},
  {id:"tatuagem", label:"tatuagem de festa",color:"#ffc7df", icon:iconTattoo},
  {id:"bexiga",   label:"bexiga",     color:"#9ed6ff", icon:iconBalloon},

// ── State ──────────────────────────────────────────────────────────
const state = {
  selected: new Set(),
  found: new Set(),
  finalSeed: 1,
};

// ── Screen 1: render grid ──────────────────────────────────────────
const grid = document.getElementById('grid');
ITEMS.forEach(it=>{
  const tile = document.createElement('button');
  tile.className = 'tile no-select';
  tile.dataset.id = it.id;
  tile.setAttribute('aria-pressed','false');
  tile.innerHTML = `
    <div class="icon">${it.icon()}</div>
    <div class="name">${it.label}</div>
  `;
  tile.addEventListener('click', ()=>{
    if (state.selected.has(it.id)) state.selected.delete(it.id);
    else state.selected.add(it.id);
    tile.classList.toggle('selected', state.selected.has(it.id));
    tile.setAttribute('aria-pressed', state.selected.has(it.id) ? 'true':'false');
    updateCounter();
    updateCTA();
  });
  grid.appendChild(tile);
});

function updateCounter(){
  document.getElementById('counter-num').textContent = state.selected.size;
}
function updateCTA(){
  const btn = document.getElementById('go-find');
  const hint = document.getElementById('cta-hint');
  if (state.selected.size >= 6){
    btn.removeAttribute('disabled');
    hint.textContent = `pronta para a busca? ✨`;
  } else {
    btn.setAttribute('disabled','');
    const n = 6 - state.selected.size;
    hint.textContent = `escolha mais ${n} ${n===1?'item':'itens'} para começar`;
  }
}
updateCTA();

document.getElementById('go-find').addEventListener('click', ()=>{
  if (state.selected.size < 6) return;
  startFindScreen();
});

// ── Screen 2: build find scene ─────────────────────────────────────
function startFindScreen(){
  // precompute positions for items in scene
  const ids = [...state.selected];
  state.found = new Set();
  state.placements = ids.map((id, i)=>{
    const item = ITEMS.find(x=>x.id===id);
    // pseudo-random based on id string to keep placement consistent per item
    let h = 0; for (const c of id) h = (h*31 + c.charCodeAt(0)) >>> 0;
    const x = 8 + (h % 84);
    const hy = ((h >> 7) % 70);
    const y = 12 + hy;
    const w = 7 + ((h >> 3) % 6);
    const z = ((h >> 11) % 30) + 10;
    return {id, item, x, y, w, z};
  });
  renderScene();
  renderChecklist();
  document.getElementById('screen-pick').style.display = 'none';
  document.getElementById('screen-find').style.display = 'block';
  document.getElementById('screen-final').style.display = 'none';
  startHintTimer();
}

function findItem(id, evt){
  if (state.found.has(id)) return;
  state.found.add(id);
  const placement = state.placements.find(x=>x.id===id);
  const g = document.querySelector(`#scene-svg .findable[data-id="${id}"]`);
  if (g){
    g.classList.add('found');
    const r = g.getBoundingClientRect();
    const stage = document.getElementById('stage').getBoundingClientRect();
    spawnConfetti(r.left+r.width/2 - stage.left, r.top+r.height/2 - stage.top);
    spawnPuff(r.left+r.width/2 - stage.left, r.top+r.height/2 - stage.top);
  }
  // mark checklist
  const slot = document.querySelector(`#checklist .slot[data-id="${id}"]`);
  if (slot) slot.classList.add('found');
  updateProgress();
  // If all found → next screen
  if (state.found.size === state.selected.size){
    clearTimeout(state.hintTimer);
    setTimeout(showFinalScreen, 700);
  }
}

function spawnPuff(x,y){
  const stage = document.getElementById('stage');
  const p = document.createElement('div');
  p.className = 'puff';
  p.style.left = x+'px';
  p.style.top = y+'px';
  stage.appendChild(p);
  setTimeout(()=>p.remove(), 600);
}
function spawnConfetti(x,y){
  const stage = document.getElementById('stage');
  const burst = document.createElement('div');
  burst.className = 'confetti-burst';
  const colors = ['#ff6fa8','#9ed6ff','#ffe28a','#7ddcb1','#e9d8ff','#ff9ec6'];
  for (let i=0;i<14;i++){
    const s = document.createElement('span');
    const angle = (i/14)*Math.PI*2;
    const dist = 60 + Math.random()*60;
    s.style.setProperty('--dx', Math.cos(angle)*dist+'px');
    s.style.setProperty('--dy', Math.sin(angle)*dist+'px');
    s.style.background = colors[i%colors.length];
    s.style.transform = `translate(-50%,-50%) rotate(${Math.random()*360}deg)`;
    s.style.animationDelay = (Math.random()*0.1)+'s';
    burst.appendChild(s);
  }
  burst.style.left = x+'px';
  burst.style.top = y+'px';
  stage.appendChild(burst);
  setTimeout(()=>burst.remove(), 1200);
}

function renderChecklist(){
  const c = document.getElementById('checklist');
  c.innerHTML = '';
  [...state.selected].forEach(id=>{
    const item = ITEMS.find(x=>x.id===id);
    const slot = document.createElement('div');
    slot.className = 'slot';
    slot.dataset.id = id;
    slot.title = item.label;
    slot.innerHTML = item.icon();
    c.appendChild(slot);
  });
}
function updateProgress(){
  const total = state.selected.size;
  const done = state.found.size;
  document.getElementById('progress-bar').style.width = total? (100*done/total)+'%' : '0%';
  document.getElementById('progress-label').textContent = `${done} de ${total}`;
}

// hint timer: every ~10s of no finds, spotlight one unfound
let lastFoundAt = Date.now();
function startHintTimer(){
  state.hintTimer = setInterval(()=>{
    if (document.getElementById('screen-find').style.display !== 'block') return;
    const now = Date.now();
    if (now - lastFoundAt < 9500) return;
    const remaining = state.placements.filter(p=>!state.found.has(p.id));
    if (!remaining.length) return;
    // remove prior hint
    document.querySelectorAll('.findable.hint').forEach(g=>g.classList.remove('hint'));
    const pick = remaining[Math.floor(Math.random()*remaining.length)];
    const g = document.querySelector(`#scene-svg .findable[data-id="${pick.id}"]`);
    if (g){
      g.classList.add('hint');
      // schedule removal in case it stays
      setTimeout(()=>{ if (!state.found.has(pick.id)) g.classList.remove('hint'); }, 4000);
    }
    lastFoundAt = Date.now();
  }, 3000);
}
// reset lastFoundAt on each find
const origFind = findItem;
findItem = function(id, evt){
  lastFoundAt = Date.now();
  document.querySelectorAll('.findable.hint').forEach(g=>g.classList.remove('hint'));
  return origFind(id, evt);
};

function startFinaleConfetti(){
  const c = document.querySelector('#screen-final .finale');
  c.querySelectorAll('.confetti-burst').forEach(n=>n.remove());
  const colors = ['#ff6fa8','#9ed6ff','#ffe28a','#7ddcb1','#e9d8ff','#ff9ec6'];
  const burst = document.createElement('div');
  burst.className = 'confetti-burst';
  burst.style.cssText = 'position:absolute;inset:0;pointer-events:none;';
  c.appendChild(burst);
  for (let i=0;i<60;i++){
    const s = document.createElement('span');
    const startX = Math.random()*100;
    const startY = -10;
    s.style.cssText = `position:absolute;width:8px;height:12px;border-radius:2px;
      background:${colors[i%colors.length]};
      left:${startX}%;top:${startY}%;
      animation:rain ${2+Math.random()*2}s linear ${Math.random()}s forwards;`;
    burst.appendChild(s);
  }
  // inject keyframes for rain once
  if (!document.getElementById('rainKf')){
    const style = document.createElement('style');
    style.id = 'rainKf';
    style.textContent = `@keyframes rain{
      0%{transform:translateY(0) rotate(0);opacity:1}
      100%{transform:translateY(620px) rotate(720deg);opacity:0}
    }`;
    document.head.appendChild(style);
  }
}

// ── restart / variation buttons ────────────────────────────────────
document.getElementById('restart').addEventListener('click', ()=>{
  state.selected.clear();
  state.found.clear();
  document.querySelectorAll('.tile.selected').forEach(t=>t.classList.remove('selected'));
  document.getElementById('screen-final').style.display = 'none';
  document.getElementById('screen-pick').style.display = 'block';
  updateCounter();
  updateCTA();
  window.scrollTo({top:0,behavior:'smooth'});
});
document.getElementById('variation').addEventListener('click', ()=>{
  state.finalSeed++;
  state.found.clear();
  renderFinalScene();
  startFinaleConfetti();
});

// ── splash hide on load ────────────────────────────────────────────
window.addEventListener('load', ()=>{
  setTimeout(()=>{
    const sp = document.getElementById('splash');
    sp.classList.add('gone');
    setTimeout(()=>sp.remove(), 600);
  }, 600);
});
// also hide immediately if already past load
if (document.readyState === 'complete'){
  setTimeout(()=>{
    const sp = document.getElementById('splash');
    sp.classList.add('gone');
    setTimeout(()=>sp.remove(), 600);
  }, 400);
}

// ── tap-empty-area: subtle puff (no penalty) ───────────────────────
document.getElementById('stage').addEventListener('click', e=>{
  if (e.target.closest('.findable')) return;
  const r = document.getElementById('stage').getBoundingClientRect();
  spawnPuff(e.clientX - r.left, e.clientY - r.top);
});

// prevent context menu on long-press (mobile game UX)
document.addEventListener('contextmenu', e=>{
  if (e.target.closest('.tile, .findable, .cta, .big-btn')) e.preventDefault();
});
</script>
